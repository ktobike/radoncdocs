[project]
name = "radoncdocs-demo"
version = "0.8.1"
description = "Portfolio-safe FastAPI app for cited policy retrieval and research-paper summarization."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate>=0.33,<2",
    "chromadb>=1.0.16",
    "fastapi>=0.116.1",
    "langchain-chroma>=0.2.5",
    "langchain-core>=0.3.0",
    "langchain-huggingface>=0.3.1",
    "langchain-text-splitters>=0.3.9",
    "pymupdf>=1.26.3",
    "python-dotenv>=1.1.1",
    "python-multipart>=0.0.9",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.1.0",
    "transformers>=4.44,<5",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",  # fastapi.testclient
    "pytest>=8",
    "ruff>=0.8",
]
demo = [
    "reportlab>=4.2",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingImports = false
include = ["api", "rag", "ingest", "scripts"]
extraPaths = ["."]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "demo_metadata"]

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "rag*", "ingest*"]
exclude = ["data*", "site*", "ui*", "scripts*"]
